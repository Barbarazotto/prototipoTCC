
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | TripInsight</title>

    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <div class="login-container">

        <div class="logo">
            <span>✈</span>
            <h1>TripInsight</h1>
        </div>

        <h2>Bem-vindo de volta!</h2>

        <p class="subtitulo">
            Faça login para continuar
        </p>

        <form id="loginForm">

            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                placeholder="seu@email.com"
                required
            >

            <label for="senha">
                Senha
            </label>

            <div class="senha-container">

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >

                <button
                    type="button"
                    id="mostrarSenha"
                    class="olho"
                    aria-label="Mostrar senha">

                    <img
                        src="https://img.icons8.com/?size=100&id=986&format=png&color=000000"
                        alt="Mostrar senha"
                    >

                </button>

            </div>

            <div class="recuperar-senha">
                <a href="redefinir-senha.html">
                    Esqueceu sua senha?
                </a>
            </div>

            <button
                type="submit"
                class="botao-login">

                Entrar

            </button>

        </form>

        <p id="mensagem"></p>

        <p class="cadastro-texto">

            Não tem uma conta?

            <a href="cadastro.html">
                Criar conta
            </a>

        </p>

    </div>

    <script src="../js/login.js"></script>

</body>

</html>
